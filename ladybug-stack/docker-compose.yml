services:

  # -------------------------------------------------------
  # AACT clinical trial data (PostgreSQL)
  # run_pipeline.py reads from ctgov schema here
  # -------------------------------------------------------
  postgres:
    image: postgres:15
    container_name: aact-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aactdb
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  # -------------------------------------------------------
  # LadybugDB Explorer — embedded graph DB + web UI
  # Graph data lives at LBUG_DIR=/database (named volume = persistent)
  # Access via browser at http://localhost:8000
  # Stop this container before running ladybug_import.py (single writer)
  # -------------------------------------------------------
  explorer:
    image: ghcr.io/ladybugdb/explorer:latest
    container_name: ladybug-explorer
    user: "1000:1000"
    ports:
      - "8000:8000"
    environment: {}
    volumes:
      - graph_data:/database
      
  # -------------------------------------------------------
  # Jupyter Notebook — Pytorch + PyG CUDA-enabled environment with
  # embedded graph DB + web UI
  # Graph data lives at LBUG_DIR=/database (named volume = persistent)
  # Access via browser at http://localhost:8888
  # Stop this container before running ladybug-explorer (single writer)
  # -------------------------------------------------------
  jupyter:
    build:
      context: ..
      dockerfile: ladybug-stack/Dockerfile
    container_name: graph-jupyter
    user: "1000:1000"
    ports:
      - "8888:8888"
    shm_size: "8gb"
    gpus: all
    environment:
      HOME: /home/jupyter
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HOME: /tmp/huggingface
      TRANSFORMERS_CACHE: /tmp/huggingface
      HUGGINGFACE_HUB_CACHE: /tmp/huggingface
      LBUG_DIR: /database/database.kz
    volumes:
      - graph_data:/database
      - ../aact-pipeline:/app
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root

  # -------------------------------------------------------
  # Graph-Pipeline — runs run_pipeline.py + ladybug_import.py
  # Mounts graph_data so ladybug_import.py writes directly to the
  # same embedded DB the Explorer reads from.
  # Run with: docker compose run --rm graph-pipeline python ladybug_import.py
  # -------------------------------------------------------
  graph-pipeline:
    gpus: all
    runtime: nvidia
    build:
      context: ..
      dockerfile: ladybug-stack/Dockerfile
    container_name: graph-pipeline
    user: "1000:1000"
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: aactdb
      DB_USER: postgres
      DB_PASS: postgres
      HF_HOME: /tmp/huggingface
      TRANSFORMERS_CACHE: /tmp/huggingface
      HUGGINGFACE_HUB_CACHE: /tmp/huggingface
      LBUG_DIR: /database/database.kz
    volumes:
      - ../aact-pipeline:/app
      - graph_data:/database

volumes:
  pg_data:
  graph_data:
